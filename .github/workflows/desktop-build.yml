name: Build desktop editor from source
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'web-platform/shared/runtime-config/**', 'gamemodes/weapons/data/header.pwn', '.github/workflows/desktop-build.yml']
  pull_request:
    paths: ['desktop/**', 'web-platform/shared/runtime-config/**', 'gamemodes/weapons/data/header.pwn', '.github/workflows/desktop-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --include=dev
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRP-Framework-Editor-Windows-x64
          path: desktop/dist/OpenRP Framework Editor-win32-x64/
          if-no-files-found: error
